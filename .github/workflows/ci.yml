name: CI

# Every check a pull request must pass, on GitHub's own runners and with no
# secrets: each product's lint, typecheck, tests and build. Nothing here
# deploys.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jollity:
    name: Jollity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Typecheck (DIM2 opening)
        run: npm exec -- tsc -p apps/jollity-app/tsconfig.lab.json --noEmit
      - name: Offline DIM2 opening controls
        run: npm exec -- vitest run apps/jollity-app/tests/lab
      - run: npm run typecheck:engines
      - run: npm test
      - name: Build the app (static export) and the chat worker
        run: npm run build && npm run build:chat
        env:
          NEXT_PUBLIC_NETWORK_NAME: paseo
          # the worker refuses to build without the name it is published under
          PRODUCT_DOTNS: example.paseo

  humanity:
    name: Humanity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run humanity:lint
      - run: npm run humanity:typecheck
      - name: Root lab offline checks
        run: npm run lab:check
      - name: Lab offline checks
        run: npm run --workspace @humanity/app humanity:lab:check
      - run: npm run humanity:test
      - run: npm run humanity:build
