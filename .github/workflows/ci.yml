name: CI

# Every check a pull request must pass, on GitHub's own runners and with no
# secrets: each product's lint, typecheck, tests and build. Nothing here
# deploys.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jollity:
    name: Jollity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:engines
      - run: npm test
      - name: Build the app (static export) and the chat worker
        run: npm run build && npm run build:chat
        env:
          NEXT_PUBLIC_NETWORK_NAME: paseo
          # the worker refuses to build without the name it is published under
          PRODUCT_DOTNS: example.paseo

  humanity:
    name: Humanity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run humanity:lint
      - run: npm run humanity:typecheck
      - run: npm run humanity:test
      - run: npm run humanity:build

  player-data-guard:
    # No plaintext player data in this public repo, on EVERY pull request (no path
    # filter above): scan all tracked files for SS58/hex/username/person-key patterns,
    # decompress *.gz, and assert no usernames* or *.enc file is tracked. Stdlib only.
    name: Player-data guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/tests/player_data_guard.py
      - run: python3 -B .github/tests/test_player_data_guard.py
