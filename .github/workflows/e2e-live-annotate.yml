name: E2E live recording annotation
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Crew annotation recovery source={0} attempt={1}', inputs.source_run_id, inputs.source_run_attempt) || format('Crew annotation source={0} event={1} {2}', github.event.workflow_run.name, github.event.workflow_run.event, github.event.workflow_run.display_title) }}"

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed E2E source workflow run ID
        required: true
        type: string
      source_run_attempt:
        description: Exact source workflow attempt
        required: true
        default: "1"
        type: string
  workflow_run:
    workflows: ["E2E (live)", "PreviewNet Crew Nightly"]
    types: [completed]

# Video encoding is deliberately outside the live workflow's per-network
# concurrency group. A slow or failed render can never delay the next game.
concurrency:
  group: e2e-live-annotate-${{ inputs.source_run_id || github.event.workflow_run.id || github.run_id }}-${{ inputs.source_run_attempt || github.event.workflow_run.run_attempt || github.run_attempt }}
  cancel-in-progress: false


permissions:
  actions: read
  contents: read

jobs:
  publish-recordings:
    needs: [prepare, annotate]
    name: publish source run ${{ github.event.workflow_run.id }} (${{ matrix.execution_key }})
    if: >-
      always() && !cancelled() &&
      github.event_name == 'workflow_run' &&
      ((github.event.workflow_run.path == '.github/workflows/e2e-live.yml' && github.event.workflow_run.event == 'workflow_dispatch') ||
       (github.event.workflow_run.path == '.github/workflows/e2e-live-nightly.yml' &&
        (github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule'))) &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      needs.prepare.outputs.has_results == 'true' &&
      needs.prepare.outputs.has_publication == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.publication_matrix) }}
    concurrency:
      group: previewnet-crew-public-release
      cancel-in-progress: false
    env:
      RELEASE_REPOSITORY: ${{ vars.CREW_VIDEO_RELEASE_REPOSITORY || 'paritytech/jollity-tests' }}
      PUBLICATION_APPROVED: ${{ vars.CREW_PUBLIC_VIDEO_APPROVED }}
      E2E_EXECUTION_KEY: ${{ matrix.execution_key }}
      SOURCE_ATTEMPT: ${{ matrix.source_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Require the one-time public-video safety approval
        id: approval
        run: |
          if [ "$PUBLICATION_APPROVED" != "true" ]; then
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "Set CREW_PUBLIC_VIDEO_APPROVED=true only after one annotated recording has been reviewed frame by frame for recovery phrases, tokens, credentials, and internal URLs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "approved=true" >> "$GITHUB_OUTPUT"
      - name: Download the source publication bundle
        if: steps.approval.outputs.approved == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: selected-results
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Download every annotated player POV
        if: steps.approval.outputs.approved == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-live-${{ github.event.workflow_run.id }}-attempt-${{ matrix.source_attempt }}-${{ matrix.execution_key }}-crew-hud-*-annotation-${{ github.run_attempt }}
          path: annotated-artifacts
      - name: Upload directly playable MP4s to the run prerelease
        if: steps.approval.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ secrets.JOLLITY_TESTS_RELEASE_TOKEN }}
        run: >-
          npx tsx scripts/e2e-live/crew/release-recordings-cli.mts
          selected-results/publication-out/publication-bundle.json
          annotated-artifacts released-publication-bundle.json
          --repository "$RELEASE_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: steps.approval.outputs.approved == 'true'
        with:
          name: e2e-live-${{ github.event.workflow_run.id }}-public-records-attempt-${{ matrix.source_attempt }}${{ github.event.workflow_run.path == '.github/workflows/e2e-live-nightly.yml' && format('-{0}', matrix.execution_key) || '' }}
          path: released-publication-bundle.json
          if-no-files-found: error
          retention-days: 3

  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       ((github.event.workflow_run.path == '.github/workflows/e2e-live.yml' && github.event.workflow_run.event == 'workflow_dispatch') ||
        (github.event.workflow_run.path == '.github/workflows/e2e-live-nightly.yml' &&
         (github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule'))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_results: ${{ steps.matrix.outputs.has_results }}
      has_publication: ${{ steps.matrix.outputs.has_publication }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      publication_matrix: ${{ steps.matrix.outputs.publication_matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
      SOURCE_ATTEMPT: ${{ inputs.source_run_attempt || github.event.workflow_run.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      # A run ID typed into a dispatch is checked like a workflow_run source
      # before anything downloads its artifacts: this repository's own live or
      # nightly workflow, started by a dispatch or the schedule from this
      # repository (never a pull request, never a fork).
      - name: Require a trusted source run
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid source run ID" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" '
            def path: .path | split("@") | first;
            .head_repository.full_name == $repo and
            ((path == ".github/workflows/e2e-live.yml" and .event == "workflow_dispatch") or
             (path == ".github/workflows/e2e-live-nightly.yml" and (.event == "workflow_dispatch" or .event == "schedule")))' source-run.json > /dev/null; then
            echo "Source run $SOURCE_RUN_ID is not a dispatched or scheduled live run of this repository." >&2
            exit 1
          fi
      - run: npm ci
      - name: Discover selected results by source attempt, execution and group
        id: matrix
        run: npx tsx scripts/e2e-live/crew/annotation-plan-cli.mts

  annotate:
    needs: prepare
    if: needs.prepare.outputs.has_results == 'true'
    name: annotate source run ${{ inputs.source_run_id || github.event.workflow_run.id }} (${{ matrix.execution_key }}, ${{ matrix.group }}, bots ${{ matrix.bots_label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ matrix.source_attempt }}
      E2E_EXECUTION_KEY: ${{ matrix.execution_key }}
      EXECUTION_DIR: work/${{ matrix.directory }}
      BOTS: ${{ matrix.bots_label }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - name: Install annotation dependencies
        id: install
        run: npm ci
      - name: Prepare the recording renderer
        continue-on-error: true
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Download the source run's selected result set
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.artifact_name }}
          path: work/${{ matrix.directory }}/selected-results
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || github.event.workflow_run.id }}
      - name: Download the selected original recording artifacts
        if: always() && !cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p "$EXECUTION_DIR/selected-results" "$EXECUTION_DIR/recording-artifacts"
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts?per_page=100" | jq -s '{artifacts: map(.artifacts) | add}' > artifacts.json
          for bot in ${BOTS//-/ }; do
            result="$EXECUTION_DIR/selected-results/result-${bot}.json"
            if [ ! -f "$result" ]; then
              echo "bot ${bot}: selected result unavailable"
              continue
            fi
            attempt=$(jq -r ".run.attempt" "$result")
            artifact_name="e2e-live-${RUN_ID}-attempt-${attempt}-${E2E_EXECUTION_KEY}-bot${bot}"
            artifact_id=$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name)] | if length == 1 then .[0].id else empty end' artifacts.json)
            if [ -z "$artifact_id" ]; then
              echo "bot ${bot}: exact original artifact ${artifact_name} unavailable or ambiguous"
              continue
            fi
            destination="$EXECUTION_DIR/recording-artifacts/bot-${bot}"
            archive="$RUNNER_TEMP/recording-${artifact_id}.zip"
            mkdir -p "$destination"
            if ! gh api "repos/${{ github.repository }}/actions/artifacts/${artifact_id}/zip" > "$archive" || ! unzip -q "$archive" -d "$destination"; then
              echo "bot ${bot}: could not download exact original artifact ${artifact_name}"
              rm -rf "$destination"
            fi
          done
      - name: Render evidence-driven crew HUD recordings
        if: always() && !cancelled()
        continue-on-error: true
        run: npx tsx scripts/e2e-live/recording-annotate-cli.mts "$EXECUTION_DIR/selected-results" "$EXECUTION_DIR/recording-artifacts" "$EXECUTION_DIR/annotated-recordings" --run-id "$RUN_ID" --bots "$BOTS"
      - name: Explain a renderer setup failure per bot
        if: always() && !cancelled()
        run: |
          mkdir -p "$EXECUTION_DIR"
          cd "$EXECUTION_DIR"
          if [ -f annotated-recordings/annotation-summary.json ]; then
            exit 0
          fi
          mkdir -p annotated-recordings
          for bot in ${BOTS//-/ }; do
            mkdir -p "annotated-recordings/bot-${bot}"
            jq -n --arg runId "$RUN_ID" --argjson slot "$bot" --arg detail "recording renderer did not start; inspect the install and renderer preparation steps" '{version:1, runId:$runId, slot:$slot, detail:$detail}' > "annotated-recordings/bot-${bot}/annotation-unavailable.json"
          done
          jq -s --arg runId "$RUN_ID" '{version:1, runId:$runId, bots: map({slot:.slot, status:"unavailable", detail:.detail})}' annotated-recordings/bot-*/annotation-unavailable.json > annotated-recordings/annotation-summary.json
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        continue-on-error: true
        with:
          name: e2e-live-${{ inputs.source_run_id || github.event.workflow_run.id }}-attempt-${{ matrix.source_attempt }}-${{ env.E2E_EXECUTION_KEY }}-crew-hud-${{ matrix.group }}-annotation-${{ github.run_attempt }}
          path: work/${{ matrix.directory }}/annotated-recordings/
          if-no-files-found: warn
          retention-days: 3
